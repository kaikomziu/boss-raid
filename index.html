<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BOSS RAID - 1億HPのボスをみんなで倒せ</title>
<meta name="description" content="1億HPのボスを世界中のプレイヤーとリアルタイム協力で連打して倒す。倒すたび少し強い次のボスが無限に出現。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👹</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="fxCanvas"></canvas>

<div id="app">
  <header id="topbar">
    <h1 class="logo">👹 BOSS RAID</h1>
    <div class="topbtns">
      <button id="skinBtn" class="ghost">🎨 スキン</button>
      <button id="muteBtn" class="ghost">🔊 音 ON</button>
      <button id="infoBtn" class="ghost">❔ 遊び方</button>
    </div>
  </header>

  <div id="presenceRow">
    <span class="pulse"></span>今 <b id="players">–</b> 人が戦っている ／ 討伐数 <b id="killCount">0</b> ／ 全体DPS <b id="dps">0 /秒</b>
  </div>

  <div id="setupBanner" class="setup">
    ⚙️ Supabase の <code>boss_raid_state</code> テーブルがまだ作成されていません。<br>
    SQL を実行するとリアルタイム協力が有効になります(それまではローカル表示のみ)。
  </div>

  <main id="stage">
    <div id="shakeWrap">
      <div id="bossNo" class="boss-no">BOSS #1</div>
      <div id="bossName" class="boss-name">スライム大王</div>

      <div id="clickArea">
        <div id="bossEmoji" class="boss-emoji">👹</div>
        <div class="boss-shadow"></div>
      </div>

      <div id="hpWrap">
        <div id="hpBar"><div id="hpFill"></div></div>
        <div class="hp-line">
          <span id="hpText">100,000,000 / 100,000,000</span>
          <span id="hpPct">100%</span>
        </div>
      </div>

      <p class="hint">画面をクリック / タップ、またはスペースキーで殴る</p>
    </div>
  </main>

  <footer id="contrib">
    <div class="card">
      <div class="card-label">あなたの累計クリック</div>
      <div class="card-value" id="myTotal">0</div>
    </div>
    <div class="card">
      <div class="card-label">このボスへのダメージ</div>
      <div class="card-value" id="myDmg">0</div>
      <div class="card-sub">全体の <span id="myDmgPct">0%</span></div>
    </div>
  </footer>
</div>

<div id="popLayer"></div>
<div id="banner"></div>

<div id="skinPanel">
  <div class="panel">
    <div class="panel-head">
      <span>🎨 スキン</span>
      <button id="skinClose" class="ghost">✕ 閉じる</button>
    </div>
    <div id="skinGrid"></div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
